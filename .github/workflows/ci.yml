name: ci
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # shellcheck, jq and yq are preinstalled on ubuntu-latest
      - run: .github/scripts/check-workflow.sh
