# Target repositories Tessera works on, in priority order: a usage limit stops the whole
# daily run, so put the project you care most about first.
#
# Which Jira project tracks a repo is a fact about the workflow, not about the code, so the
# key lives here rather than in the target repo's AGENTS.md.
#
# projects:
#   - name: my-app                     # clone and data folder name under /workspace
#     repo: https://github.com/you/my-app.git
#     jira_project: ABC                # Jira Scrum project key
#     max_tickets_per_day: 6           # tune to your plan's usage limits
#     enabled: true
projects: []
